<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Workflow: Idea, Design, Build, Containerize, Deploy, Iterate">
  <defs>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- connectors -->
  <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 8" marker-end="url(#arrow)" fill="none">
    <line x1="156" y1="95" x2="204" y2="95"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="1s" repeatCount="indefinite"/></line>
    <line x1="366" y1="95" x2="414" y2="95"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="1s" repeatCount="indefinite"/></line>
    <line x1="576" y1="95" x2="624" y2="95"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="1s" repeatCount="indefinite"/></line>
    <line x1="786" y1="95" x2="834" y2="95"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="1s" repeatCount="indefinite"/></line>
    <line x1="996" y1="95" x2="1044" y2="95"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="1s" repeatCount="indefinite"/></line>
  </g>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(0 0)">
      <rect x="2" y="35" width="150" height="120" rx="20" fill="url(#node)" stroke="url(#ring)" stroke-width="2"/>
      <text x="77" y="78" font-size="22" font-weight="800" fill="#fcd34d">01</text>
      <text x="77" y="106" font-size="18" font-weight="700" fill="#ffffff">Idea</text>
      <text x="77" y="130" font-size="12" fill="#94a3b8">Define the problem</text>
    </g>
    <g transform="translate(210 0)">
      <rect x="2" y="35" width="150" height="120" rx="20" fill="url(#node)" stroke="url(#ring)" stroke-width="2"/>
      <text x="77" y="78" font-size="22" font-weight="800" fill="#fcd34d">02</text>
      <text x="77" y="106" font-size="18" font-weight="700" fill="#ffffff">Design</text>
      <text x="77" y="130" font-size="12" fill="#94a3b8">Plan the architecture</text>
    </g>
    <g transform="translate(420 0)">
      <rect x="2" y="35" width="150" height="120" rx="20" fill="url(#node)" stroke="url(#ring)" stroke-width="2"/>
      <text x="77" y="78" font-size="22" font-weight="800" fill="#fcd34d">03</text>
      <text x="77" y="106" font-size="18" font-weight="700" fill="#ffffff">Build</text>
      <text x="77" y="130" font-size="12" fill="#94a3b8">Write clean code</text>
    </g>
    <g transform="translate(630 0)">
      <rect x="2" y="35" width="150" height="120" rx="20" fill="url(#node)" stroke="url(#ring)" stroke-width="2"/>
      <text x="77" y="78" font-size="22" font-weight="800" fill="#fcd34d">04</text>
      <text x="77" y="106" font-size="18" font-weight="700" fill="#ffffff">Containerize</text>
      <text x="77" y="130" font-size="12" fill="#94a3b8">Package with Docker</text>
    </g>
    <g transform="translate(840 0)">
      <rect x="2" y="35" width="150" height="120" rx="20" fill="url(#node)" stroke="url(#ring)" stroke-width="2"/>
      <text x="77" y="78" font-size="22" font-weight="800" fill="#fcd34d">05</text>
      <text x="77" y="106" font-size="18" font-weight="700" fill="#ffffff">Deploy</text>
      <text x="77" y="130" font-size="12" fill="#94a3b8">Automate pipelines</text>
    </g>
    <g transform="translate(1050 0)">
      <rect x="2" y="35" width="146" height="120" rx="20" fill="url(#node)" stroke="url(#ring)" stroke-width="2"/>
      <text x="75" y="78" font-size="22" font-weight="800" fill="#fcd34d">06</text>
      <text x="75" y="106" font-size="18" font-weight="700" fill="#ffffff">Iterate</text>
      <text x="75" y="130" font-size="12" fill="#94a3b8">Optimize and improve</text>
    </g>
  </g>
</svg>
